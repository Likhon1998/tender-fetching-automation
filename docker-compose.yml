################################################################################
# Tender Fetching Automation — Docker Compose
#
# Two non-production profiles (not production):
#   dev  — hot reload, source mounts, Vite + uvicorn --reload
#   qa   — built images, nginx frontend, closer to a test/staging server
#
# Usage:
#   docker compose --env-file .env.dev --profile dev up --build
#   docker compose --env-file .env.qa  --profile qa  up --build
#
# Prefer separate project names so data stays isolated:
#   docker compose -p tender-dev --env-file .env.dev --profile dev up --build
#   docker compose -p tender-qa  --env-file .env.qa  --profile qa  up --build
################################################################################

services:
  # Shared PostgreSQL — included in both profiles
  db:
    image: postgres:16-alpine
    profiles: ["dev", "qa"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tender-fetching}
    ports:
      - "${DB_PUBLISH_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tender_net

  # ---------- DEV profile ----------
  backend-dev:
    profiles: ["dev"]
    build:
      context: ./tender-backend
      target: development
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-tender-fetching}
      DB_DRIVER: postgresql+asyncpg
      ENVIRONMENT: development
      RUN_SEEDS: ${RUN_SEEDS:-true}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./tender-backend/app:/app/app
      - ./tender-backend/alembic:/app/alembic
      - ./tender-backend/scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tender_net

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./tender-frontend
      target: development
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./tender-frontend/src:/app/src
      - ./tender-frontend/index.html:/app/index.html
    depends_on:
      - backend-dev
    networks:
      - tender_net

  # ---------- QA profile ----------
  backend-qa:
    profiles: ["qa"]
    build:
      context: ./tender-backend
      target: qa
    restart: unless-stopped
    env_file:
      - .env.qa
    environment:
      # Defaults to the bundled db container; set DB_HOST/DB_PORT in .env.qa
      # to use an external PostgreSQL (start with --no-deps, see DOCKER.md).
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-tender-fetching}
      DB_DRIVER: postgresql+asyncpg
      ENVIRONMENT: qa
      RUN_SEEDS: ${RUN_SEEDS:-true}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tender_net

  frontend-qa:
    profiles: ["qa"]
    build:
      context: ./tender-frontend
      target: qa
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend-qa
    networks:
      - tender_net

volumes:
  postgres_data:

networks:
  tender_net:
    driver: bridge
